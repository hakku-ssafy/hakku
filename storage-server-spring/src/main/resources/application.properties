spring.application.name=storage-server-spring
server.port=${STORAGE_PORT:8082}

storage.base-path=${STORAGE_BASE_PATH:./data/images}

# main-server와 동일한 base64 JWT 시크릿 (미설정 시 result 이미지 공개)
jwt.secret=${JWT_SECRET:}

management.endpoints.web.exposure.include=health,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.prometheus.access=unrestricted
management.prometheus.metrics.export.enabled=true

# Grafana histogram_quantile(P95/P99)용 — http_server_requests_seconds_bucket 노출
management.metrics.distribution.percentiles-histogram.http.server.requests=true

