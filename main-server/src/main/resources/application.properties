spring.application.name=main-server

# ── Datasource (PostgreSQL, env-driven) ──
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:hakku}
spring.datasource.username=${POSTGRES_USER:hakku}
spring.datasource.password=${POSTGRES_PASSWORD:hakku}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ── Redis ──
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ── JWT ──
jwt.secret=${JWT_SECRET}
jwt.access-ttl-seconds=${JWT_ACCESS_TTL_SECONDS:3600}

# ── Kafka ──
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# ── Actuator / Prometheus ──
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.prometheus.access=unrestricted
management.prometheus.metrics.export.enabled=true
