spring.application.name=main-server

# ── Datasource (PostgreSQL, env-driven) ──
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:hakku}
spring.datasource.username=${POSTGRES_USER:hakku}
spring.datasource.password=${POSTGRES_PASSWORD:hakku}

# ── Redis ──
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ── JWT (access 15분 / refresh 24시간) ──
jwt.secret=${JWT_SECRET}
jwt.access-ttl-seconds=${JWT_ACCESS_TTL_SECONDS:900}
jwt.refresh-ttl-seconds=${JWT_REFRESH_TTL_SECONDS:86400}
# 리프레시 토큰 쿠키 Secure 속성 (운영 https=true. 로컬 http 개발 시 REFRESH_COOKIE_SECURE=false 로 내려 저장 허용).
auth.refresh-cookie.secure=${REFRESH_COOKIE_SECURE:true}

# ── 초기 관리자 시드 (운영 전용) ──
# 공개 회원가입은 ADMIN 을 거부한다. 최초 관리자는 시작 시 AdminSeeder 가 생성한다.
# email 미설정이면 시드를 건너뛴다. 비밀번호는 반드시 env(APP_ADMIN_PASSWORD)로 주입(평문 금지).
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}
app.admin.nickname=${APP_ADMIN_NICKNAME:관리자}

# ── Kafka ──
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# ── Actuator / Prometheus ──
# 보안: 헬스 세부(데이터소스/Kafka/Redis 주소 등)를 비인증에 노출하지 않는다.
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.prometheus.access=unrestricted
management.prometheus.metrics.export.enabled=true
