# Test profile: in-memory H2, no external infra required.
# Keeps the @SpringBootTest smoke test green before real Postgres wiring.
spring.datasource.url=jdbc:h2:mem:hakku;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Flyway migrations run against real Postgres only; disabled for unit tests.
spring.flyway.enabled=false
