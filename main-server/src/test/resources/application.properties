# Test profile: in-memory H2, no external infra required.
# Keeps the @SpringBootTest smoke test green before real Postgres wiring.
# MODE=PostgreSQL + INIT: H2 lacks the `TIMESTAMPTZ` alias, so register it as a DOMAIN
# before Flyway runs the PostgreSQL migrations (production migrations stay unchanged).
spring.datasource.url=jdbc:h2:mem:hakku;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE DOMAIN IF NOT EXISTS TIMESTAMPTZ AS TIMESTAMP WITH TIME ZONE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway builds the H2 schema (PostgreSQL mode). JPA/Hibernate removed.
spring.flyway.enabled=true

# JWT (test-only literal secret; 40 bytes base64 → HS256 OK)
jwt.secret=MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OQ==
jwt.access-ttl-seconds=3600
jwt.refresh-ttl-seconds=86400
auth.refresh-cookie.secure=false

# Kafka — fire-and-forget; fast timeout so tests don't hang when broker is absent
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.properties.max.block.ms=200
spring.kafka.producer.properties.request.timeout.ms=200
spring.kafka.producer.properties.delivery.timeout.ms=500

# Redis — NotificationService is @MockitoBean in @SpringBootTest tests so Redis is not called
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ── Actuator / Prometheus (test) ──
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.prometheus.access=unrestricted
management.prometheus.metrics.export.enabled=true
# Redis/Kafka health checks disabled — services not available in unit test environment
management.health.redis.enabled=false
management.health.kafka.enabled=false
management.health.db.enabled=false
