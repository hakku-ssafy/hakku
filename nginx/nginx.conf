worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    client_max_body_size 10m;

    server {
        listen 80;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /api/ {
            set $upstream_main main-server:8080;
            proxy_pass http://$upstream_main;
        }

        location /ai/ {
            set $upstream_ai ai-server:8000;
            rewrite ^/ai/(.*)$ /$1 break;
            proxy_pass http://$upstream_ai;
        }

        location /chat/ {
            set $upstream_chat chatbot-server:8000;
            rewrite ^/chat/(.*)$ /$1 break;
            proxy_pass http://$upstream_chat;
            # SSE: nginx 버퍼링 비활성화
            proxy_buffering off;
            proxy_cache off;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
        }

        location /product-images/ {
            alias /usr/share/nginx/product-images/;
            expires 7d;
            add_header Cache-Control "public";
        }

        location /storage/ {
            set $upstream_storage storage-server:8080;
            proxy_pass http://$upstream_storage;
        }

        location / {
            set $upstream_frontend frontend:80;
            proxy_pass http://$upstream_frontend;
        }
    }
}
