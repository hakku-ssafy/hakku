worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # ── Compression ────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # ── Upload limit (image uploads) ───────────────────────────────────────────
    client_max_body_size 10m;

    # ── Upstream declarations ───────────────────────────────────────────────────
    upstream main_server {
        server main-server:8080;
    }

    upstream ai_server {
        server ai-server:8000;
    }

    upstream storage_server {
        server storage-server:8080;
    }

    upstream frontend {
        server frontend:80;
    }

    # ── Server block ────────────────────────────────────────────────────────────
    server {
        listen 80;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Spring Boot API
        location /api/ {
            proxy_pass http://main_server;
        }

        # AI server — strip /ai/ prefix before forwarding
        location /ai/ {
            proxy_pass http://ai_server/;
        }

        # Storage server
        location /storage/ {
            proxy_pass http://storage_server;
        }

        # Frontend (catch-all)
        location / {
            proxy_pass http://frontend;
        }
    }
}
