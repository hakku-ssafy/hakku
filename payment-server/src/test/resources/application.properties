# Test profile: in-memory H2, no external infra required.
# Keeps the @SpringBootTest smoke test green before real Postgres wiring.
spring.datasource.url=jdbc:h2:mem:hakku_payment;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Flyway migrations run against real Postgres only; disabled for unit tests.
spring.flyway.enabled=false

# JWT (test-only literal secret; 40 bytes base64 -> HS256 OK)
jwt.secret=MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OQ==
jwt.access-ttl-seconds=3600

# PG webhook (test-only secret for HMAC signature verification) — M-6: 32바이트 이상.
payment.webhook.secret=test-webhook-secret-0123456789abcdef

# 토스 결제위젯 (test) — 공개 문서용 샌드박스 키. API 테스트는 TossPaymentClient 를 @MockitoBean 으로 대체하므로
# 실제 호출은 없지만, 실 RestClientTossPaymentClient 빈이 모든 @SpringBootTest 컨텍스트에 로드되려면 값이 필요하다.
payment.toss.base-url=https://api.tosspayments.com
payment.toss.secret-key=test_gsk_docs_OaPz8L5KdmQXkzRz3y47BMw6
# 샌드박스(test_) 키를 쓰므로 H-2 fail-fast 검증을 끈다(운영 properties 는 검증 ON).
payment.toss.secret-key-validation-enabled=false

# Kafka -- fire-and-forget; fast timeout so tests don't hang when broker is absent
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.properties.max.block.ms=200
spring.kafka.producer.properties.request.timeout.ms=200
spring.kafka.producer.properties.delivery.timeout.ms=500

# 아웃박스 릴레이 스케줄러는 테스트에서 OFF(폴링할 실 브로커 없음). main 의 true 를 명시적으로 덮어쓴다.
payment.outbox.relay.enabled=false

# Redis -- not contacted at context load
spring.data.redis.host=localhost
spring.data.redis.port=6379

# -- Actuator / Prometheus (test) — M-1: 운영과 동일하게 노출 최소화 + 헬스 세부 비노출 --
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.prometheus.access=unrestricted
management.prometheus.metrics.export.enabled=true
# Redis/Kafka/DB health checks disabled -- services not available in unit test environment
management.health.redis.enabled=false
management.health.kafka.enabled=false
management.health.db.enabled=false
