# Test profile: in-memory H2, no external infra required.
# Keeps the @SpringBootTest smoke test green before real Postgres wiring.
spring.datasource.url=jdbc:h2:mem:hakku_payment;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Flyway migrations run against real Postgres only; disabled for unit tests.
spring.flyway.enabled=false

# JWT (test-only literal secret; 40 bytes base64 -> HS256 OK)
jwt.secret=MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OQ==
jwt.access-ttl-seconds=3600

# PG webhook (test-only secret for HMAC signature verification)
payment.webhook.secret=test-webhook-secret

# Kafka -- fire-and-forget; fast timeout so tests don't hang when broker is absent
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.properties.max.block.ms=200
spring.kafka.producer.properties.request.timeout.ms=200
spring.kafka.producer.properties.delivery.timeout.ms=500

# Redis -- not contacted at context load
spring.data.redis.host=localhost
spring.data.redis.port=6379

# -- Actuator / Prometheus (test) --
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.prometheus.access=unrestricted
management.prometheus.metrics.export.enabled=true
# Redis/Kafka/DB health checks disabled -- services not available in unit test environment
management.health.redis.enabled=false
management.health.kafka.enabled=false
management.health.db.enabled=false
