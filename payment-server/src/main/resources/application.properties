spring.application.name=payment-server

# -- HTTP 포트 (호스트 직접 기동 시 main(8080)/ai(8000)/storage(8081)/storage-spring(8082) 와 충돌 회피) --
server.port=${SERVER_PORT:8083}

# -- Datasource (PostgreSQL, env-driven) --
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:hakku}
spring.datasource.username=${POSTGRES_USER:hakku}
spring.datasource.password=${POSTGRES_PASSWORD:hakku}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# -- Flyway (main-server 와 hakku DB 공유 → 별도 이력 테이블 + baseline 로 마이그레이션 충돌 회피) --
spring.flyway.table=flyway_schema_history_payment
spring.flyway.baseline-on-migrate=true
# baseline-version 기본값(1)이면 비어있지 않은 공유 스키마에서 baseline 이 v1 에 찍혀 V1__init_payments(v1)가
# "baseline 초과(>1)" 조건에 걸려 스킵된다 → payments 테이블 미생성 → validate 실패로 부팅 불가. 0 으로 낮춰 V1 실행 보장.
spring.flyway.baseline-version=0

# -- Redis --
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# -- JWT (shared secret with main-server for stateless verification) --
jwt.secret=${JWT_SECRET}
jwt.access-ttl-seconds=${JWT_ACCESS_TTL_SECONDS:3600}

# -- PG Webhook (shared secret with the PG for HMAC signature verification) --
payment.webhook.secret=${PAYMENT_WEBHOOK_SECRET}

# -- 토스페이먼츠 결제위젯 (v2 SDK → v1 결제 승인 API). 시크릿키는 서버에만; 프론트엔 VITE_TOSS_CLIENT_KEY 별도. --
# 기본값 없음(fail-fast): TOSS_SECRET_KEY 미설정/샌드박스(test_) 키면 TossSecretKeyValidator 가 부팅을 막는다.
payment.toss.base-url=${TOSS_API_BASE_URL:https://api.tosspayments.com}
payment.toss.secret-key=${TOSS_SECRET_KEY}
# H-1: 토스 confirm 무응답 시 워커 스레드 무한 점유 방지 (connect 3s / read 8s).
payment.toss.connect-timeout-ms=${TOSS_CONNECT_TIMEOUT_MS:3000}
payment.toss.read-timeout-ms=${TOSS_READ_TIMEOUT_MS:8000}

# -- H-4: 결제 엔드포인트 레이트리밋 (인증 사용자/IP 단위 토큰 버킷, 인스턴스 로컬) --
# 분산(다중 인스턴스) 전역 한도가 필요하면 RateLimiter 구현을 Redis 백엔드로 교체한다.
payment.rate-limit.enabled=${PAYMENT_RATE_LIMIT_ENABLED:true}
payment.rate-limit.capacity=${PAYMENT_RATE_LIMIT_CAPACITY:60}
payment.rate-limit.refill-per-second=${PAYMENT_RATE_LIMIT_REFILL:10}

# -- Kafka --
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# -- Outbox relay (운영: 스케줄러 ON. 테스트 프로파일은 false 로 명시 override) --
payment.outbox.relay.enabled=true

# -- Actuator / Prometheus --
# M-1: 노출 최소화 — 브라우징 가능한 /actuator/metrics 는 미노출, 헬스 세부는 인증 시에만 노출.
# /actuator/prometheus 는 내부 Prometheus 스크레이핑용으로 유지(nginx 는 /actuator 를 외부로 프록시하지 않음).
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.prometheus.access=unrestricted
management.prometheus.metrics.export.enabled=true
