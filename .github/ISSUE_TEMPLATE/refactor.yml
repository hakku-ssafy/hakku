name: 🔧 리팩토링 / 기술 부채
description: 코드 개선, 성능 최적화, 기술 부채 해소를 제안합니다
title: "[REFACTOR] "
labels: ["refactor"]
body:
  - type: input
    id: component
    attributes:
      label: 대상 컴포넌트
      description: 개선 대상 서비스/모듈을 적어주세요
      placeholder: 예) main-server, storage-server
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: 현재 상태
      description: 개선이 필요한 코드나 구조를 설명해주세요
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: 개선 목표
      description: 리팩토링 후 기대하는 상태를 설명해주세요
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 우선순위
      options:
        - 높음 (성능·보안에 직접 영향)
        - 보통 (코드 품질 개선)
        - 낮음 (장기적 개선)
    validations:
      required: true
