name: ✨ 기능 제안
description: 새로운 기능 또는 개선 사항을 제안합니다
title: "[FEAT] "
labels: ["enhancement"]
body:
  - type: input
    id: component
    attributes:
      label: 대상 컴포넌트
      description: 기능이 추가될 서비스/모듈을 적어주세요
      placeholder: 예) frontend, chatbot-service
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 현재 어떤 불편함 또는 한계가 있는지 설명해주세요
      placeholder: 예) 학생증 꾸미기 결과를 공유할 방법이 없어서 불편합니다
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 제안하는 해결책
      description: 어떻게 기능을 구현하면 좋을지 아이디어를 설명해주세요
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안
      description: 다른 방법도 고려했다면 설명해주세요 (선택)

  - type: textarea
    id: additional
    attributes:
      label: 추가 컨텍스트
      description: 참고할 링크, 스크린샷, 관련 이슈 등 (선택)
